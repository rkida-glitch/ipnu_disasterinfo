name: Update JMA warnings

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch JMA VPWS50 and build JSON
        run: python scripts/update_warnings.py

      - name: Commit updated warning data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/warnings.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Update JMA warning data"
            git push
          fi
